name: Build Z-Flow Windows app

on:
  push:
    branches: [main]
    paths:
      - "**.cs"
      - "**.csproj"
      - "app.manifest"
      - "tools/**"
      - ".github/workflows/build.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Generate application icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/generate_icon.py
          if (!(Test-Path "assets/zflow.ico")) { throw "Icon generation failed." }

      - name: Download official WinDivert release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "2.2.2"
          $url = "https://github.com/basil00/WinDivert/releases/download/v$version/WinDivert-$version-A.zip"
          $zip = Join-Path $env:RUNNER_TEMP "WinDivert.zip"
          $extract = Join-Path $env:RUNNER_TEMP "WinDivert"
          Invoke-WebRequest -Uri $url -Headers @{ "User-Agent" = "ZFlow-Build" } -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force

          $dll = Get-ChildItem -Path $extract -Filter "WinDivert.dll" -Recurse | Select-Object -First 1
          $driver = Get-ChildItem -Path $extract -Filter "WinDivert64.sys" -Recurse | Select-Object -First 1
          if ($null -eq $dll -or $null -eq $driver) {
            throw "WinDivert.dll or WinDivert64.sys was not found in the official release archive."
          }

          $signature = Get-AuthenticodeSignature -FilePath $driver.FullName
          if ($signature.Status -ne "Valid") {
            throw "The WinDivert driver signature did not validate: $($signature.Status)."
          }

          New-Item -ItemType Directory -Force -Path "native" | Out-Null
          Copy-Item $dll.FullName "native/WinDivert.dll" -Force
          Copy-Item $driver.FullName "native/WinDivert64.sys" -Force
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/basil00/WinDivert/v$version/LICENSE" -Headers @{ "User-Agent" = "ZFlow-Build" } -OutFile "native/LICENSE.txt"
          Write-Host "WinDivert driver signer: $($signature.SignerCertificate.Subject)"
          Write-Host "WinDivert.dll bytes: $((Get-Item 'native/WinDivert.dll').Length)"
          Write-Host "WinDivert64.sys bytes: $((Get-Item 'native/WinDivert64.sys').Length)"

      - name: Restore and compile
        run: dotnet restore ZFlow.csproj

      - name: Publish self-contained single-file EXE
        run: dotnet publish ZFlow.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o dist

      - name: Verify executable contents
        shell: pwsh
        run: |
          $exe = Get-Item "dist/ZFlow.exe"
          if ($exe.Length -lt 5000000) { throw "The EXE is unexpectedly small; embedded native resources may be missing." }
          Write-Host "Built $($exe.FullName) ($($exe.Length) bytes)"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ZFlow-DPI-Toolkit-Windows-x64
          path: dist/ZFlow.exe
          if-no-files-found: error
